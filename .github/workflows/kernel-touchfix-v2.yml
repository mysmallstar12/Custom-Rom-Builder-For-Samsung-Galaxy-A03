name: Build A03 Touchfix Kernel

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/kernel-touchfix.yml'

permissions:
  contents: read

env:
  IVER_REPO: IverCoder/android_kernel_samsung_a03
  IVER_TAG: 4.14.199-202508171328
  IVER_COMMIT: b48e9ddfd73a361f1a4a7c5bfe6a66fd54a00287
  IVER_RELEASE_ASSET: 4.14.199-a03_IverCoder-202508171328-KSUNext.7z
  IVER_RELEASE_SHA256: 93d637168261833003bc680c92646c7d8f2b71d4ca9f8843a0f82855ede5fd9f
  KSU_TAG: v1.0.9
  OUT_NAME: A03-touchfix-v1-KSUNext

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@v4

      - name: Install host packages
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git curl ca-certificates bc bison flex build-essential \
            libssl-dev libelf-dev libncurses-dev libyaml-dev pkg-config python3 cpio \
            p7zip-full xz-utils zstd rsync
          sudo apt-get install -y --no-install-recommends libtinfo5 || true

      - name: Fetch exact IverCoder kernel source
        shell: bash
        run: |
          set -euxo pipefail
          git init kernel
          cd kernel
          git remote add origin "https://github.com/${IVER_REPO}.git"
          git fetch --depth=1 origin "refs/tags/${IVER_TAG}:refs/tags/${IVER_TAG}"
          git checkout --detach "${IVER_TAG}"
          test "$(git rev-parse HEAD)" = "${IVER_COMMIT}"
          echo "Kernel source: $(git rev-parse HEAD)"

      - name: Fetch exact Android build toolchains
        shell: bash
        run: |
          set -euxo pipefail
          cd kernel

          CLANG_DIR="$PWD/toolchain/clang/host/linux-x86/clang-r383902"
          GCC_DIR="$PWD/toolchain/gcc/linux-x86/aarch64/aarch64-linux-android-4.9"

          mkdir -p "$CLANG_DIR" "$GCC_DIR"

          curl -L --fail --retry 5 --retry-delay 2 \
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/tags/android-11.0.0_r3/clang-r383902.tar.gz" \
            | tar -xz -C "$CLANG_DIR"

          curl -L --fail --retry 5 --retry-delay 2 \
            "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/+archive/refs/tags/android-11.0.0_r3.tar.gz" \
            | tar -xz -C "$GCC_DIR"

          test -x "$CLANG_DIR/bin/clang"
          test -x "$CLANG_DIR/bin/ld.lld"
          test -x "$GCC_DIR/bin/aarch64-linux-android-as"
          test -x "$GCC_DIR/bin/aarch64-linux-android-objcopy"

          "$CLANG_DIR/bin/clang" --version
          "$CLANG_DIR/bin/ld.lld" --version
          "$GCC_DIR/bin/aarch64-linux-android-as" --version | head -n 1

      - name: Apply conservative touch recovery patch
        shell: bash
        run: |
          set -euxo pipefail
          cd kernel

          NVT='drivers/input/touchscreen/HS03/nvt_touch/nt36xxx.h'
          CTS='drivers/input/touchscreen/HS03/chipone/cts_config.h'

          grep -q '^#define NVT_TOUCH_ESD_PROTECT 0$' "$NVT"
          sed -i 's/^#define NVT_TOUCH_ESD_PROTECT 0$/#define NVT_TOUCH_ESD_PROTECT 1/' "$NVT"
          grep -q '^#define NVT_TOUCH_ESD_PROTECT 1$' "$NVT"

          grep -q '^//#define CONFIG_CTS_ESD_PROTECTION$' "$CTS"
          sed -i 's|^//#define CONFIG_CTS_ESD_PROTECTION$|#define CONFIG_CTS_ESD_PROTECTION|' "$CTS"
          grep -q '^#define CONFIG_CTS_ESD_PROTECTION$' "$CTS"

          echo 'Touch patch applied:'
          grep -n 'NVT_TOUCH_ESD_PROTECT' "$NVT" | head
          grep -n 'CONFIG_CTS_ESD_PROTECTION' "$CTS" | head

      - name: Integrate pinned KernelSU Next
        shell: bash
        run: |
          set -euxo pipefail
          cd kernel
          curl -LSs \
            "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/${KSU_TAG}/kernel/setup.sh" \
            -o /tmp/ksu-setup.sh
          sh /tmp/ksu-setup.sh "${KSU_TAG}"
          test -L drivers/kernelsu
          test -f KernelSU-Next/kernel/Kconfig
          test "$(git -C KernelSU-Next describe --tags --exact-match)" = "${KSU_TAG}"

      - name: Configure kernel
        shell: bash
        run: |
          set -euxo pipefail
          cd kernel

          export CROSS_COMPILE="$PWD/toolchain/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/bin/aarch64-linux-android-"
          export ARCH=arm64
          export CLANG_TOOL_PATH="$PWD/toolchain/clang/host/linux-x86/clang-r383902/bin"
          export PATH="${CLANG_TOOL_PATH}:${PATH}"
          export BSP_BUILD_FAMILY=qogirl6
          export DTC_OVERLAY_TEST_EXT="$PWD/tools/mkdtimg/ufdt_apply_overlay"
          export DTC_OVERLAY_VTS_EXT="$PWD/tools/mkdtimg/ufdt_verify_overlay_host"
          export BSP_BUILD_ANDROID_OS=y

          command -v clang
          command -v ld.lld
          command -v "${CROSS_COMPILE}as"
          clang --version
          ld.lld --version

          make O="$PWD/out" BSP_BUILD_DT_OVERLAY=y CC=clang LD=ld.lld \
            ARCH=arm64 CLANG_TRIPLE=aarch64-linux-gnu- a03_cis_open_defconfig

          ./scripts/config --file out/.config \
            --set-str LOCALVERSION '-a03_IverCoder-touchfix-v1-KSUNext'
          ./scripts/config --file out/.config -d LOCALVERSION_AUTO
          ./scripts/config --file out/.config -e OVERLAY_FS
          ./scripts/config --file out/.config -e KSU
          ./scripts/config --file out/.config -e KSU_KPROBES_HOOK

          make O="$PWD/out" BSP_BUILD_DT_OVERLAY=y CC=clang LD=ld.lld \
            ARCH=arm64 CLANG_TRIPLE=aarch64-linux-gnu- olddefconfig

          grep -q '^CONFIG_KSU=y$' out/.config
          grep -q '^CONFIG_KSU_KPROBES_HOOK=y$' out/.config
          grep -q '^CONFIG_KPROBES=y$' out/.config
          grep -q '^CONFIG_OVERLAY_FS=y$' out/.config
          grep '^CONFIG_LOCALVERSION=' out/.config

      - name: Build kernel
        shell: bash
        run: |
          set -euxo pipefail
          cd kernel

          export CROSS_COMPILE="$PWD/toolchain/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/bin/aarch64-linux-android-"
          export ARCH=arm64
          export CLANG_TOOL_PATH="$PWD/toolchain/clang/host/linux-x86/clang-r383902/bin"
          export PATH="${CLANG_TOOL_PATH}:${PATH}"
          export BSP_BUILD_FAMILY=qogirl6
          export DTC_OVERLAY_TEST_EXT="$PWD/tools/mkdtimg/ufdt_apply_overlay"
          export DTC_OVERLAY_VTS_EXT="$PWD/tools/mkdtimg/ufdt_verify_overlay_host"
          export BSP_BUILD_ANDROID_OS=y

          command -v clang
          command -v ld.lld
          command -v "${CROSS_COMPILE}as"
          clang --version
          ld.lld --version

          make O="$PWD/out" BSP_BUILD_DT_OVERLAY=y CC=clang LD=ld.lld \
            ARCH=arm64 CLANG_TRIPLE=aarch64-linux-gnu- -j"$(nproc)"

          test -s out/arch/arm64/boot/Image
          ls -lh out/arch/arm64/boot/Image

      - name: Download and verify original IverCoder boot template
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p template

          URL="https://github.com/${IVER_REPO}/releases/download/${IVER_TAG}/${IVER_RELEASE_ASSET}"
          curl -L --fail --retry 5 --retry-delay 2 -o template/original.7z "$URL"

          echo "${IVER_RELEASE_SHA256}  template/original.7z" | sha256sum -c -
          7z x -y -otemplate/extracted template/original.7z

          echo 'Original release package contents:'
          find template/extracted -maxdepth 2 -type f -printf '%P  %s bytes\n' | sort

          TEMPLATE_IMG="$(find template/extracted -type f -name '*.img' -print -quit)"
          test -n "$TEMPLATE_IMG"
          test -s "$TEMPLATE_IMG"
          cp "$TEMPLATE_IMG" template/original-boot.img
          ls -lh template/original-boot.img

      - name: Repack boot image and create Odin TAR
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p repack artifact odin

          cp template/original-boot.img repack/original-boot.img
          cp kernel/Publish/magiskboot repack/magiskboot
          chmod +x repack/magiskboot

          cd repack
          ./magiskboot unpack original-boot.img
          test -e kernel
          cp ../kernel/out/arch/arm64/boot/Image kernel
          ./magiskboot repack original-boot.img boot.img
          test -s boot.img
          cd ..

          cp repack/boot.img odin/boot.img
          tar --format=ustar -cf "artifact/${OUT_NAME}.tar" -C odin boot.img

          sha256sum "artifact/${OUT_NAME}.tar" > artifact/SHA256SUMS.txt
          ls -lh artifact/*

      - name: Write build metadata
        shell: bash
        run: |
          set -euxo pipefail
          {
            echo "Device: Samsung Galaxy A03 SM-A035F"
            echo "Base kernel source: ${IVER_REPO}"
            echo "Base tag: ${IVER_TAG}"
            echo "Base commit: ${IVER_COMMIT}"
            echo "KernelSU Next: ${KSU_TAG}"
            echo "Patch v1: enable existing Novatek NT36xxx ESD recovery watchdog"
            echo "Patch v1: enable existing Chipone ESD recovery watchdog"
            echo "GalaxyCore/Jadard: unchanged"
            echo "Boot template: official IverCoder ${IVER_TAG} release asset"
          } > artifact/BUILD-INFO.txt

      - name: Upload flashable kernel artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.OUT_NAME }}
          path: artifact/
          if-no-files-found: error
          compression-level: 9
          retention-days: 30
