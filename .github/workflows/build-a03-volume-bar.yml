name: Build A03 Volume Bar APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'volume-bar-apk/**'
      - 'volume-bar-apk.zip'
      - '.github/workflows/build-a03-volume-bar.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Unpack source
        run: unzip -q volume-bar-apk.zip
      - name: Build release APK
        working-directory: volume-bar-apk
        run: gradle --no-daemon :app:assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: A03-Volume-Bar-APK
          path: volume-bar-apk/app/build/outputs/apk/release/app-release-unsigned.apk
