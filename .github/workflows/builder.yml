name: Custom Rom Builder Samsung Galaxy A03
permissions:
  contents: write
on:
  workflow_dispatch:
    inputs:
        GSI:
              description: 'GSI Image Direct Link'
              required: true
              default: 'https://github.com/naz664/ArrowOS_gsi/releases/download/v2023.10.28/ArrowOS-13.1-arm64_bgN-slim-Unofficial.img.xz'        # find some recommendations in readme (last lines)
        NAME:
              description: 'Rom Name'
              required: true
              default: 'ArrowOS-13.1-arm64-ab-BgN-June2026-BIT9.7z' # idk bro name it anything
        VERSION:
              description: 'Baseband Version'
              required: true
              default: 'A035FXXS9CYG1' # rename this to your baseband in developer options
        VENDOR:
              description: 'Enter Direct Link Of Your Version Vendor'
              required: true
              default: 'https://sourceforge.net/projects/a03-file/files/A035FXXS9CYG1/vendor.img' # use your vendor from SamFW 

jobs:
  Build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v2

    - name: Install Dependencies
      run: |
        sudo apt update
        sudo apt install -y zip xz-utils unzip p7zip-full wget android-sdk-libsparse-utils
        
    - name: Installing Tools
      run: |
        git clone https://github.com/Exynos-nigg/lpunpack-lpmake-mirror.git lpbinary
        cd lpbinary
        bash install.sh

    - name: Downloading Your GSI And Extracting # i hate this part personally
      run: |
        cd lpbinary/binary
        wget ${{ github.event.inputs.GSI }} -O gsi_archive
        mkdir sys
        
        # Check the magic bytes or extension type to route extraction
        if unzip -t gsi_archive >/dev/null 2>&1; then
          unzip gsi_archive -d sys/
        elif file gsi_archive | grep -q 'gzip'; then
          mv gsi_archive sys/gsi.img.gz
          cd sys && gunzip gsi.img.gz && cd ..
        elif file gsi_archive | grep -q 'XZ'; then
          mv gsi_archive sys/gsi.img.xz
          cd sys && unxz gsi.img.xz && cd ..
        fi
        
        # Pull the extracted raw system partition back to the build folder root
        mv sys/*.img system.img 2>/dev/null || mv sys/system.img system.img
        rm -rf sys gsi_archive
        
    - name: Preparing Files
      run: |
        cd lpbinary/binary
        
        # Download everything cleanly as direct raw images—no tool conversions needed!
        wget ${{ github.event.inputs.VENDOR }} -O vendor.img
        wget https://sourceforge.net/projects/a03-file/files/A035FXXS9CYG1/product.img -O product.img
        wget https://sourceforge.net/projects/a03-file/files/A035FXXS9CYG1/system_ext.img -O system_ext.img 
        
    - name: Packing
      run: |
        cd lpbinary/binary
        ./lpmake --metadata-size 65536 --super-name super --metadata-slots 3 --device super:6763315200 --group main:6761218048 --partition system:readonly:$(ls -nl system.img | awk '{print $5}'):main --image system=system.img --partition vendor:readonly:$(ls -nl vendor.img | awk '{print $5}'):main --image vendor=vendor.img --partition product:readonly:$(ls -nl product.img | awk '{print $5}'):main --image product=product.img --partition system_ext:readonly:$(ls -nl system_ext.img | awk '{print $5}'):main --image system_ext=system_ext.img --sparse --output super.img
    - name: Creating tar and compressing to 7z
      run: |
        cd lpbinary/binary
        # Create the Odin-compatible TAR block matrix cleanly
        tar -cvf super.tar super.img
        # Force 7z to compress the TAR container FIRST before you delete anything!
        7z a ${{ github.event.inputs.NAME }} super.tar
        # Safely clean up the massive temporary image files after compression completes
        rm -rf super.img
        rm -rf super.tar

    - name: Upload to Release
      uses: softprops/action-gh-release@v1
      with:
        files: lpbinary/binary/${{ github.event.inputs.NAME }}
        name: ${{ github.event.inputs.NAME }}-${{ github.run_id }}
        tag_name: ${{ github.run_id }}
        body: |
            Device: Samsung Galaxy A03
            Version: ${{ github.event.inputs.VERSION }}
            Rom Name: ${{ github.event.inputs.NAME }}
            Flash: Extract the 7z file and flash through ODIN in AP Section.
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
