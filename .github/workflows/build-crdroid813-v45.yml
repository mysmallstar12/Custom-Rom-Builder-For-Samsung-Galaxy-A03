name: Build crDroid 8.13 Lite + kernel v4.5 Safe

permissions:
  contents: write

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-crdroid813-v45.yml"
  workflow_dispatch:

concurrency:
  group: crdroid813-lite-a035f-bit9-v45
  cancel-in-progress: false

env:
  RELEASE_TAG: crdroid8.13-a035f-bit9-touchfix-v4.5-safe
  ROM_NAME: crDroid-8.13-Android12.1-A035F-BIT9-Lite
  GSI_URL: https://downloads.sourceforge.net/project/gsi-projects/A12.1/crDroid-8.10/v-8.13/21012023/crDroid-8.13-arm64_bgN-slim-Unofficial.img.xz
  KERNEL_URL: https://github.com/mysmallstar12/Custom-Rom-Builder-For-Samsung-Galaxy-A03/releases/download/lineage20-a035f-bit9-touchfix-v4.5-safe/A03-touchfix-v4.5-Jadard-DT2W-Safe-KSUNext.tar
  VOLUME_APK_URL: https://github.com/SimonMarquis/Android-SoundQuickSettings/releases/download/1.1.0/app-release.apk

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends aria2 xz-utils p7zip-full file android-sdk-libsparse-utils
          git clone --depth=1 https://github.com/Exynos-nigg/lpunpack-lpmake-mirror.git lpbinary
          cd lpbinary
          bash install.sh

      - name: Download crDroid 8.13 Android 12.1 Slim GApps
        working-directory: lpbinary/binary
        run: |
          set -euo pipefail
          aria2c -x16 -s16 -k1M --file-allocation=none --max-tries=10 --retry-wait=3 \
            --allow-overwrite=true --auto-file-renaming=false "$GSI_URL" -o system.img.xz
          xz -t system.img.xz
          unxz system.img.xz
          test -s system.img
          file system.img
          ls -lh system.img

      - name: Download A035F BIT9 stock partitions
        working-directory: lpbinary/binary
        run: |
          set -euo pipefail
          for image in vendor product system_ext; do
            aria2c -x16 -s16 -k1M --file-allocation=none --max-tries=10 --retry-wait=3 \
              --allow-overwrite=true --auto-file-renaming=false \
              "https://downloads.sourceforge.net/project/a03-file/A035FXXS9CYG1/${image}.img" \
              -o "${image}.img"
            test -s "${image}.img"
          done

      - name: Validate partition budget and build super
        working-directory: lpbinary/binary
        run: |
          set -euo pipefail
          SYSTEM_SIZE=$(stat -c%s system.img)
          VENDOR_SIZE=$(stat -c%s vendor.img)
          PRODUCT_SIZE=$(stat -c%s product.img)
          SYSTEM_EXT_SIZE=$(stat -c%s system_ext.img)
          TOTAL=$((SYSTEM_SIZE + VENDOR_SIZE + PRODUCT_SIZE + SYSTEM_EXT_SIZE))
          test "$TOTAL" -le 6761218048
          ./lpmake \
            --metadata-size 65536 \
            --super-name super \
            --metadata-slots 3 \
            --device super:6763315200 \
            --group main:6761218048 \
            --partition system:readonly:${SYSTEM_SIZE}:main --image system=system.img \
            --partition vendor:readonly:${VENDOR_SIZE}:main --image vendor=vendor.img \
            --partition product:readonly:${PRODUCT_SIZE}:main --image product=product.img \
            --partition system_ext:readonly:${SYSTEM_EXT_SIZE}:main --image system_ext=system_ext.img \
            --sparse --output super.img
          test -s super.img
          tar --format=ustar -cf super.tar super.img

      - name: Compress ROM and split below GitHub limit
        working-directory: lpbinary/binary
        run: |
          set -euo pipefail
          7z a -mx=7 -v1900m "${ROM_NAME}-super.7z" super.tar
          test -s "${ROM_NAME}-super.7z.001"
          rm -f super.img super.tar system.img vendor.img product.img system_ext.img
          ls -lh "${ROM_NAME}-super.7z".*

      - name: Add kernel v4.5 Safe and volume Quick Settings module
        working-directory: lpbinary/binary
        run: |
          set -euo pipefail
          aria2c -x8 -s8 --file-allocation=none --max-tries=8 \
            --allow-overwrite=true --auto-file-renaming=false \
            "$KERNEL_URL" -o A03-touchfix-v4.5-Jadard-DT2W-Safe-KSUNext.tar
          test -s A03-touchfix-v4.5-Jadard-DT2W-Safe-KSUNext.tar
          tar -tf A03-touchfix-v4.5-Jadard-DT2W-Safe-KSUNext.tar | grep -qx 'boot.img'

          aria2c -x4 -s4 --file-allocation=none --max-tries=8 \
            --allow-overwrite=true --auto-file-renaming=false \
            "$VOLUME_APK_URL" -o SoundQuickSettings-1.1.0.apk
          test -s SoundQuickSettings-1.1.0.apk

          mkdir -p volume-module/system/app/SoundQuickSettings
          cp SoundQuickSettings-1.1.0.apk volume-module/system/app/SoundQuickSettings/SoundQuickSettings.apk
          printf '%s\n' \
            'id=a03_sound_quick_settings' \
            'name=A03 Sound Quick Settings' \
            'version=1.1.0' \
            'versionCode=110' \
            'author=SimonMarquis + A03 packaging' \
            'description=Adds a Volume tile to Quick Settings; tap it to open the volume sliders.' \
            > volume-module/module.prop
          printf '%s\n' \
            '#!/system/bin/sh' \
            'MODDIR=${0%/*}' \
            'set_perm_recursive "$MODDIR/system" 0 0 0755 0644' \
            > volume-module/set_permissions.sh
          chmod 0755 volume-module/set_permissions.sh
          (
            cd volume-module
            zip -r9 ../A03-Sound-Quick-Settings-KSU-Magisk.zip .
          )

      - name: Write instructions and checksums
        working-directory: lpbinary/binary
        run: |
          set -euo pipefail
          printf '%s\n' \
            'Samsung Galaxy A03 SM-A035F BIT9 / A035FXXS9CYG1' \
            'crDroid 8.13 Slim (Android 12.1) + kernel v4.5 Safe' \
            '' \
            'FLASH ROM:' \
            '1. Download every numbered ROM part into the same folder.' \
            '2. Open only .7z.001 with 7-Zip and extract super.tar.' \
            '3. Odin AP: flash super.tar.' \
            '4. Boot recovery and factory reset / format data.' \
            '5. Complete the first boot, then return to Download Mode.' \
            '6. Odin AP: flash A03-touchfix-v4.5-Jadard-DT2W-Safe-KSUNext.tar.' \
            '' \
            'VOLUME CONTROL:' \
            '7. Open KernelSU Manager > Modules > Install from storage.' \
            '8. Select A03-Sound-Quick-Settings-KSU-Magisk.zip and reboot.' \
            '9. Pull Quick Settings down, tap Edit, then add the Volume tile.' \
            '10. Tap Volume to show the slider; long-press opens Sound settings.' \
            '' \
            'DOUBLE TAP:' \
            '- Kernel v4.5 Safe handles double-tap-to-wake and keeps it enabled after unlock.' \
            '- Enable launcher double-tap-to-sleep only for an empty Home-screen area.' \
            '- Kernel-wide double-tap sleep is deliberately disabled, so PIN, keyboard, icons and apps cannot trigger sleep.' \
            '' \
            'NOTES:' \
            '- This is the Android 12.1 slim GApps build; Google Play is included.' \
            '- The Volume control is a Quick Settings tile that opens a real slider, not a permanent second bar beside brightness.' \
            '- Do not merge the ROM super.tar and kernel boot TAR.' \
            '- Kernel v4.5 Safe targets the Jadard JD9365T touch panel.' \
            '- Keep complete stock BIT9 firmware before flashing.' \
            > FLASH-INSTRUCTIONS.txt

          sha256sum "${ROM_NAME}-super.7z".* \
            A03-touchfix-v4.5-Jadard-DT2W-Safe-KSUNext.tar \
            A03-Sound-Quick-Settings-KSU-Magisk.zip \
            SoundQuickSettings-1.1.0.apk \
            > SHA256SUMS.txt

      - name: Publish permanent release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: crDroid 8.13 Android 12.1 Lite A035F BIT9 + kernel v4.5 Safe
          prerelease: true
          fail_on_unmatched_files: true
          body: |
            Lightweight crDroid 8.13 / Android 12.1 GSI package for Samsung Galaxy A03 SM-A035F BIT9.
            Uses the slim GApps image, so Google Play is included.

            Includes the separately flashable Jadard JD9365T kernel v4.5 Safe:
            persistent double-tap-to-wake, touch watchdog/recovery and KernelSU Next.
            Double-tap-to-sleep remains launcher-only for safety; taps on PIN, keyboard, icons and apps cannot trigger it.

            The optional KernelSU/Magisk module adds a Volume tile to Quick Settings. Tapping the tile opens the volume slider.
            Download all numbered 7z parts and extract beginning with .001.
          files: |
            lpbinary/binary/${{ env.ROM_NAME }}-super.7z.*
            lpbinary/binary/A03-touchfix-v4.5-Jadard-DT2W-Safe-KSUNext.tar
            lpbinary/binary/A03-Sound-Quick-Settings-KSU-Magisk.zip
            lpbinary/binary/SoundQuickSettings-1.1.0.apk
            lpbinary/binary/FLASH-INSTRUCTIONS.txt
            lpbinary/binary/SHA256SUMS.txt
