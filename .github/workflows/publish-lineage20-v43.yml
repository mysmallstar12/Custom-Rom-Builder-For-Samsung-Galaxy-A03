name: Build LineageOS 20 Stable + kernel v4.5 Safe

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-lineage20-v43.yml'

permissions:
  contents: write
  actions: read

concurrency:
  group: lineage20-a035f-bit9-v45-safe
  cancel-in-progress: true

env:
  RELEASE_TAG: lineage20-a035f-bit9-touchfix-v4.5-safe
  GSI_URL: https://downloads.sourceforge.net/project/andyyan-gsi/lineage-20-td/lineage-20.0-20251021-UNOFFICIAL-arm64_bvN.img.gz
  KERNEL_RUN_ID: '35625162518'
  KERNEL_ARTIFACT: A03-touchfix-v4.5-Jadard-DT2W-Safe-KSUNext

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies and lpmake
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            aria2 gzip p7zip-full file android-sdk-libsparse-utils
          git clone --depth=1 https://github.com/Exynos-nigg/lpunpack-lpmake-mirror.git lpbinary
          cd lpbinary
          bash install.sh

      - name: Download stable LineageOS 20 GSI with multiple connections
        working-directory: lpbinary/binary
        shell: bash
        run: |
          set -euxo pipefail
          aria2c --max-connection-per-server=16 --split=16 --min-split-size=1M \
            --file-allocation=none --allow-overwrite=true --auto-file-renaming=false \
            --max-tries=8 --retry-wait=3 "${GSI_URL}" -o system.img.gz
          gzip -t system.img.gz
          gunzip system.img.gz
          test -s system.img
          file system.img

      - name: Download BIT9 stock partitions with multiple connections
        working-directory: lpbinary/binary
        shell: bash
        run: |
          set -euxo pipefail
          for image in vendor product system_ext; do
            aria2c --max-connection-per-server=16 --split=16 --min-split-size=1M \
              --file-allocation=none --allow-overwrite=true --auto-file-renaming=false \
              --max-tries=8 --retry-wait=3 \
              "https://downloads.sourceforge.net/project/a03-file/A035FXXS9CYG1/${image}.img" \
              -o "${image}.img"
            test -s "${image}.img"
          done

      - name: Build Odin super image
        working-directory: lpbinary/binary
        shell: bash
        run: |
          set -euxo pipefail
          ./lpmake \
            --metadata-size 65536 \
            --super-name super \
            --metadata-slots 3 \
            --device super:6763315200 \
            --group main:6761218048 \
            --partition system:readonly:$(stat -c%s system.img):main --image system=system.img \
            --partition vendor:readonly:$(stat -c%s vendor.img):main --image vendor=vendor.img \
            --partition product:readonly:$(stat -c%s product.img):main --image product=product.img \
            --partition system_ext:readonly:$(stat -c%s system_ext.img):main --image system_ext=system_ext.img \
            --sparse --output super.img
          tar -cf super.tar super.img
          7z a -mx=7 -v1900m LineageOS-20-A035F-BIT9-v4.5-Safe-super.7z super.tar
          test -s LineageOS-20-A035F-BIT9-v4.5-Safe-super.7z.001
          rm -f super.img super.tar system.img vendor.img product.img system_ext.img

      - name: Add verified kernel v4.5 Safe
        working-directory: lpbinary/binary
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          mkdir -p kernel-artifact
          gh run download "${KERNEL_RUN_ID}" \
            --repo "${GITHUB_REPOSITORY}" \
            --name "${KERNEL_ARTIFACT}" \
            --dir kernel-artifact
          KERNEL_TAR="$(find kernel-artifact -type f -name '*.tar' -print -quit)"
          test -n "${KERNEL_TAR}"
          test -s "${KERNEL_TAR}"
          tar -tf "${KERNEL_TAR}" | grep -qx 'boot.img'
          cp "${KERNEL_TAR}" A03-touchfix-v4.5-Jadard-DT2W-Safe-KSUNext.tar

      - name: Create instructions and checksums
        working-directory: lpbinary/binary
        shell: bash
        run: |
          set -euxo pipefail
          cat > FLASH-INSTRUCTIONS.txt <<'EOF'
          SAMSUNG GALAXY A03 SM-A035F - BIT 9
          LINEAGEOS 20 STABLE + KERNEL v4.5 SAFE

          Day la ban LineageOS 20 cu on dinh tung chay tot voi kernel v4.3,
          nay duoc dong goi lai voi kernel v4.5 Safe.

          1. Tai TAT CA cac phan .7z.001, .002... vao cung mot thu muc.
          2. Mo file .7z.001 bang 7-Zip va giai nen super.tar.
          3. Odin: dua super.tar vao AP, KHONG chon Re-Partition, bam Start.
          4. Vao recovery, factory reset / format data, sau do khoi dong ROM.
          5. Vao Download Mode lan nua.
          6. Odin AP: flash A03-touchfix-v4.5-Jadard-DT2W-Safe-KSUNext.tar.

          Kernel v4.5 Safe:
          - Double tap de danh thuc man hinh luon bat.
          - Khong co double tap sleep toan man hinh trong kernel.
          - Khong tat nham khi go PIN, ban phim, bam icon hay thao tac lien tuc.
          - Jadard JD9365T touch recovery watchdog va KernelSU Next.

          Chi dung cho SM-A035F BIT9 voi cam ung Jadard JD9365T.
          Sao luu du lieu va firmware goc truoc khi flash.
          EOF
          sha256sum LineageOS-20-A035F-BIT9-v4.5-Safe-super.7z.* \
            A03-touchfix-v4.5-Jadard-DT2W-Safe-KSUNext.tar > SHA256SUMS.txt

      - name: Publish permanent release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: LineageOS 20 Stable A035F BIT9 + kernel v4.5 Safe
          prerelease: false
          fail_on_unmatched_files: true
          body: |
            Permanent recovery build based on the older stable LineageOS 20 GSI that worked well with kernel v4.3.
            Updated to kernel v4.5 Safe: persistent Jadard double-tap-to-wake without unsafe kernel-wide double-tap-to-sleep.
            This release is separate from the HyperOS build.
          files: |
            lpbinary/binary/LineageOS-20-A035F-BIT9-v4.5-Safe-super.7z.*
            lpbinary/binary/A03-touchfix-v4.5-Jadard-DT2W-Safe-KSUNext.tar
            lpbinary/binary/FLASH-INSTRUCTIONS.txt
            lpbinary/binary/SHA256SUMS.txt
